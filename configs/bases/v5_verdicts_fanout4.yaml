# The budget of the contract ceiling and its control -- docs/plans/2026-09-23-work-enumeration.md.
# A base so that the two run configs carry only what they vary. Everything else is the held-out
# policy (`v5_generation.yaml` plus the reviewed workspaces the held-out configs require).
#
# Dollars. $25 billed per rep is the user's ceiling, and in `fanout` it binds as jobs x the
# per-job cap (7d7d7ec): 140 specialist jobs x $0.17 = $23.80. $0.17 comes off the measured
# per-job billed cost of the fanout pair's specialist jobs -- median $0.028 / max $0.103
# unforced, median $0.050 / max $0.204 forced -- so it never bound the unforced run and would
# have bound the top ~3% of the forced one.
#
# Tokens, at 3.5M processed tokens per billed dollar rather than the calibrated 1.2M. The stopped
# pilot pr5_V_verdicts_fanout4_rep1 paused 2 of 41 jobs on a 204,000-token cap (the 1.2M ratio)
# after they had billed only $0.07 and $0.11: long, cache-heavy arm sessions run ~2-3M processed
# tokens per billed dollar, so a cap in the calibrated ratio binds well before the dollar cap and
# deletes the job's answers. On a priced model the dollar cap is the bound; 600,000 per job keeps
# the token cap from binding first. Every token cap is scaled by the same ratio, so the two
# blocks stay in step (the lead-only ones do not bind in `fanout`, but a drifted pair is how the
# next config inherits a wrong number). The fanout pair ran before token caps existed.
extends: v5_generation.yaml
dataset:
  require_reviewed_workspaces: true
  standard_budget_cap: 0.17
  standard_budget_tokens: 600000
  per_pr_token_cap: 5294000
  lead_token_cap: 3530000
  run_total_cost_cap: 25.00
  run_total_token_cap: 84000000
