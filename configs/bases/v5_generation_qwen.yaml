# The iteration tier: v5 generation on the locally hosted Qwen, through the ELM gateway.
#
# Two tiers, and which one a run is in is a decision about what its numbers are FOR:
#
#   iteration  elm_qwen_3.5  — free, local. For "does this change do anything", pipeline
#                              debugging, and shaking out a new arm or prompt. Its numbers
#                              are a signal, not a result, and must never be quoted as one.
#   keeps      gpt_5.2       — the existing `bases/v5_generation.yaml`, unchanged. For a
#                              number that gets written down, compared across reps, or shown
#                              to anyone.
#
# Nothing enforces the boundary except the run name and this comment, so: **name every run
# from this base `iter_<something>`**. The artifacts are self-describing — `V5RunPlan.model_name`
# records `elm_qwen_3.5` and `judge_identity` keys on the model, so no cache or plan can
# silently mix the tiers — but a person reading a report is the failure mode, and this
# project's record already contains an iteration number that was read as a result.
extends: v5_generation.yaml

llm_config:
  model_name: elm_qwen_3.5

  # OFF, deliberately, and this is the load-bearing line in the file.
  #
  # Qwen reasons when nothing is sent — it is the only ELM model that does, and
  # `elm_mistral_small_4` is the opposite, so there is no "ELM default" to rely on. Measured
  # 2026-09-22: reasoning on is ~100x the completion tokens (451 against 4 on one arithmetic
  # prompt) and ~23x the latency (11.5s against 0.5s).
  #
  # Both of those defeat the purpose of this tier. The latency is the direct cost — an
  # iteration loop that takes 23x longer is not an iteration loop. The token count is worse
  # than it looks: the ceilings inherited below were calibrated on `gpt_5.2`, whose 2,857 arm
  # attempts report `reasoning_tokens: 0` in 2,857 of 2,857, so they authorise
  # NON-reasoning work. Turning reasoning on here would burn them ~100x faster and produce
  # runs that pause on `PAUSED_TOKEN_LIMIT` for a reason that has nothing to do with the
  # change under test.
  #
  # `high` is the only other value ELM accepts for this model, and it needs its own
  # calibration rep before it is used for anything — see
  # docs/todo/reasoning-in-the-arms.md, which is the open question of whether the arms
  # should be reasoning at all. Do not set it here to "make Qwen better" without re-measuring
  # the ceilings; that is the same trade this file just declined.
  reasoning_effort: none

  # NOT restated, and worth knowing why: the parent's `thinking_budget_tokens: 30000` is
  # inert. Only `BaseProvider` sends it, and the provider table is OpenAI and ELM, both of
  # which override that method. It is left alone rather than zeroed because ~20 configs carry
  # it and docs/todo/reasoning-in-the-arms.md owns removing them together; `reasoning_effort`
  # above is the knob that actually reaches the endpoint.

execution:
  # Unchanged at 4, and measured rather than inherited. Qwen through ELM: 1 request 9.2s;
  # 4 concurrent 14.0s wall (median latency 11.2s); 8 concurrent 45.4s wall with a 45.4s
  # straggler. Four is about the knee.
  #
  # CAVEAT: that was measured on trivial prompts. A real arm sends 12k-38k prompt tokens
  # (p50 12,160 / p90 20,298 / max 38,154 over 554 recorded v5 sessions), so per-request
  # latency under load will be worse than 9.2s and the knee may be lower. Treat 4 as the
  # ceiling to verify on the first real rep, not one that has been confirmed under load.
  # Free tokens are not a reason to raise it: the constraint is a shared cluster, not a bill.
  max_concurrency: 4

dataset:
  # The token ceilings do NOT transfer from gpt_5.2, and this file said they did until the
  # first rep was run. Measured on `iter_qwen_plumbing_33438_rep1` (PR 33438, the control —
  # 1 work unit, 9 arms):
  #
  #   Qwen arm processed tokens: 42,692 / 128,355 / 279,140 / 296,271 / 341,210 / 358,378 /
  #                              371,405 / 376,393 / 377,152     median 341,210
  #   gpt_5.2 arm p50 35,276 / p90 87,589 / p99 243,736          (16 runs, 2,857 attempts)
  #
  # About 9.7x the median. The inherited `standard_budget_tokens: 360000` — which cut 6 of
  # 2,857 gpt_5.2 arms, 0.21% — paused 3 of 9 here, 33%, with a fourth finishing at 99.5% of
  # it. The run came back `completion_status=partial`.
  #
  # The mechanism is turns, not verbosity per turn: these arms ran 18-26 turns where the
  # gpt_5.2 arms run a median of ~6-7 tool calls, and processed tokens grow superlinearly in
  # turns because each turn re-sends the whole conversation. `processed_tokens` being
  # cache-inclusive is what makes the two numbers comparable at all; it is not the cause.
  #
  # So the ceiling is raised 3x, with the ratios preserved (1,080,000 x 5 = 5,400,000 keeps
  # the same five standard jobs a lead may buy). The basis is not the observed maximum — it is
  # that a ceiling should stop a runaway and let `max_turns` stop a normal arm, which is the
  # regime gpt_5.2 runs in. At ~350k by turn 25, an arm going the full 40 turns lands near
  # 1M, so 1,080,000 puts the turn limit back in charge.
  #
  # PROVISIONAL: n=9 arms on ONE control PR, the cheapest in the set. A real multi-PR rep
  # should revise these, and until one exists do not read a `paused_tokens` arm here as a
  # finding about Qwen's diligence.
  standard_budget_tokens: 1080000
  per_pr_token_cap: 5400000
  # Scaled with the others. `_warn_on_denomination_drift` compares RATIOS -- this cap over
  # `standard_budget_tokens` against `lead_cost_cap` over `standard_budget_cap` -- so a
  # block scaled 3x with one member left behind is drift, not conservatism. The measured
  # lead used 567,725 of its 1,200,000, nowhere near the ceiling; this moves to keep the
  # five-standard-jobs relation intact, not because the lead needed room.
  lead_token_cap: 3600000
  run_total_token_cap: 36000000
