#
# Dataset only, like the evaluation configs. Build the reviewed workspaces (no model spend):
#   ape/bin/python -m src.mathlib_review.release.prebuild --reviewed --execute --config configs/pr_review_v5_probe_2026_07_08_v1.yaml

extends: bases/v5_generation.yaml

dataset:
  release: inputs/probes/probe-2026-07-08-v1
  modification_inventory: inputs/probes/probe-2026-07-08-v1/derived/modification_inventory.jsonl
  require_reviewed_workspaces: true
