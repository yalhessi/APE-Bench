# Contract v2 under ape_agent on the self-hosted DeepSeek-V4.1-Flash -- the iteration tier.
#
# The gpt_5.2 contract-v2 config (2 of 23 on the dev held-out 12) with only the model changed, as the
# local Qwen3.5-397B was (results/pr_review_v5/probes/local-quality-2026-10-02/: 2, 0, 2 of 23). The
# server is /research/projects/proofedit/ya475/localmodel/serve_ds41.sbatch on `first`, port 8012,
# answering to the HF id. `local_deepseek_v4.1_flash` is its own model (LLMProvider.LOCAL), so the
# run plan names what served the run. Reasoning is set per run by --set llm_config.reasoning_effort.
extends: pr_review_v5_dev_medium_gpt52_Grc_contract2.yaml

llm_config:
  model_name: local_deepseek_v4.1_flash
  openai_api: chat_completions
  openai_responses_reasoning_carryover: false

execution:
  max_concurrency: 12
