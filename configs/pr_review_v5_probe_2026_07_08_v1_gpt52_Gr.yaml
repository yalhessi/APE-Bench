# Test (d) of docs/todo/reviewer-model-gap.md: condition G with reasoning on
# (results/pr_review_v5/probes/gpt52-postcutoff-2026-09-29/README.md, "Test (d)"). Everything else
# is G's. The caps are doubled so they cannot bind: a session that reaches its cap stops with no
# findings, which is what confounded the in-window reasoning twin (29 of 140 jobs paused).
extends: pr_review_v5_probe_2026_07_08_v1_gpt52_G.yaml

llm_config:
  reasoning_effort: high

dataset:
  solo_cost_cap: 3.00
  solo_token_cap: 3600000
  # 6 PRs x $3.00 = $18.00 worst case a run.
  run_total_cost_cap: 18.50
  run_total_token_cap: 22200000
