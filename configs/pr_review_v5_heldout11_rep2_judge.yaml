# Score heldout11 rep2 against gold: issue_match and resolution_match, rubric v8.
#
# `input_kind: finding` judges the text the system actually publishes, not pre-merge
# candidate wording — a verdict on wording the merge discarded credits nothing real.
#
# Aggregation is `majority_issue_then_resolution_among_issue_matching`: resolution is scored
# only among pairs whose issue already matched, which is exactly the two-level question
# ("did it raise the same issue" / "and did it propose the same fix").
#
# `pairing_tiers: [anchor]` is deliberately NOT widened. File and relation tiers exist and
# produced zero pairs because this config disables them. Enabling them can only raise recall
# and would make this run incomparable with every previous one — a measurement change to make
# on its own, not folded into a run that is already testing two new mechanisms.
# NO PATHS HERE. `candidates`, `out_dir` and `run_name` are derived by `judge --of <run_name>`
# from the generation run being scored. They used to be written out, and they disagreed:
# pr_review_v5_medium_heldout.yaml was bumped to rep2 while this file still read rep1 --
# scoring the old run under the new run's name, with nothing to notice. One source now.
#
#   python -m src.datasets.pr_review_v5.cli judge --config <this> --of <run_name> --execute
extends: bases/v5_judge.yaml

dataset:
  pr_numbers:
  - 33117
  - 33145
  - 33285
  - 33294
  - 33305
  - 33321
  - 33337
  - 33362
  - 33421
  control_pr_numbers:
  - 33304
  - 33315
