# the tree renders `focused-prompt/4` (patch-set contract, per-target diff scoping, the
# differential-audit fixes), so it differs from the treatment in its prompts too. Budget, and why
# its token block is not in the calibrated ratio: `bases/v5_verdicts_fanout4.yaml`.
