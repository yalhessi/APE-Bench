# (33145, 33315 control, 33337, 33421), under the DEFAULT submission contract: the job-level
# abstention, and each arm's sealed verification policy. `pr_review_v5_verdicts_fanout4.yaml`
# adds the two contract lines and nothing else. At 0cfb162 the two runs shared all 140 prompts (the
# directives were stamped on payloads after `build_agenda`); since the 2026-09-23 unification the
# knobs also render contract text, so the treatment's specialist prompts differ from this control's
# in the contract section alone. This control still rebuilds byte-identical to
