# The reviewer-model probe's gpt_5.2 solo conditions on the dev set, dev-medium-0.3.0 less 33057
# (docs/plans/2026-09-29-probe-harness.md, configs/probe_sets/dev_medium_0_3_0.yaml). The release and
# the modification inventory are the generation base's.
extends: bases/v5_solo.yaml

scaffold_type: ape_agent

dataset:
  require_reviewed_workspaces: true
  pr_numbers: [33066, 33098, 33117, 33145, 33149, 33285, 33294, 33304, 33305, 33315, 33321, 33337, 33362, 33421, 33438]
  # The five context tools the Claude sessions hold through `cli tool` (toolbox.CONTEXT_TOOLS).
  solo_context_tools: [zulip_search, precedent_search, declaration_search, naming_norm, proof_profile]
  # 15 PRs x solo_cost_cap $1.50 = $22.50 worst case a run (33057 has no reviewed workspace).
  run_total_cost_cap: 23.00
  run_total_token_cap: 27100000
