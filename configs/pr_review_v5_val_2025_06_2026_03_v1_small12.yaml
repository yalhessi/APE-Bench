# The small version of the VALIDATION set val-2025-06-2026-03-v1: 12 of its 60 PRs, for testing at a smaller size.
# It is nested in the full set: in every stratum, the first PRs the full draw accepted in seeded
# order among those with at most 8 work units, one main PR per month (2025-06..2026-03) plus the
# first 2 AI-stratum PRs. The unit cap keeps one PR from being most of a small run: without it
# test PR 30777 held 14 of 44 units (2026-09-24).
# (`projections.frame subset --label small12 --max-units 8`; inputs/pull_requests/evaluation/val-2025-06-2026-03-v1/subset-small12.json).
# Same release, inventory and reviewed workspaces as the full config it extends. A small-set number
# is therefore a reading of PRs the full set also reads.

extends: pr_review_v5_val_2025_06_2026_03_v1.yaml

dataset:
  pr_numbers:
  - 26185
  - 26755
  - 28649
  - 29842
  - 30458
  - 30641
  - 30714
  - 32080
  - 32875
  - 34091
  - 34935
  - 36822

  # Measured by `plan` on these 12 with the base's lead caps: floor $6.05, worst case $24.05 and
  # 28,860,000 tokens. The full set's ceiling would barely bound a 12-PR run, so this one restates it.
  run_total_cost_cap: 25.00
  run_total_token_cap: 30000000
