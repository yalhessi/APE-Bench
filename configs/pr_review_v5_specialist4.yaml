# Specialist-only, on smoke4's four PRs. Does the generalist earn its place by being a better
# reviewer, or only by being a louder one?
#
# WHAT SMOKE4 MEASURED. Per candidate the generalist and the specialists are
# indistinguishable — 0.08 hits per candidate against 0.09. Its 4x lead per invocation is
# entirely volume: 26 candidates from 13 runs against 23 from 46.
#
# NOT COMPARABLE TO THE SEPTEMBER RUNS. Since those, the accounting was repaired (caps now
# bind billed cost, paused work is booked, a failed mandatory job is a coverage gap), 44% of
# every arm prompt was removed as verbatim repetition, and the renderer version was bumped.
# Execution changed materially. The September runs are forensic fixtures — see their
# correction_sidecar.json — and the first complete run after this rework is the new baseline.
#
# COVERAGE IS NOT AT RISK ON THIS SET. All 13 work units draw at least one specialist with the
# floor off; `agenda_report.units_without_specialist` is empty. Do not copy this to another PR
# set without re-checking that field: without the floor, a unit no specialist is eligible on
# is simply not reviewed, and a recall drop from that measures coverage, not arms.
extends: bases/v5_generation.yaml

dataset:
  run_name: pr_review_v5_specialist4_rep1
  pr_numbers: [33117, 33145, 33337, 33362]

  # The whole point of this run.
  generalist_floor: false
