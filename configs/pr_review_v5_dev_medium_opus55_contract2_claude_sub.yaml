# H-claude (docs/plans/2026-10-01-claude-models-under-the-harness.md): contract v2 under Claude
# Code, with claude-opus-5-5 on the CLI's own login in place of gpt_5.2 through the relay.
#
# Read against the swap (Claude given gpt's contract-v2 messages verbatim through the probe
# harness, 10 of 23): within 3 means the project harness and the probe harness are
# interchangeable for Claude; more than 3 below means the project harness costs Claude something.
# The caps are contract v2's (160 replies, 16M tokens a session). The uncapped calibration on
# 33149 used 16 replies and 1.18M, so they should not bind.
extends: pr_review_v5_dev_medium_gpt52_Grc_contract2_claude.yaml

# Null starts no relay; the CLI then runs claude_model on its own login. The inherited gpt
# settings (reasoning_effort, openai_api, carry-over) reach no model without the relay.
llm_config:
  model_name: null

claude_model: claude-opus-5-5
cli_version: 2.1.285
# A guess: the probe harness never recorded its Claude effort, and the Claude Code sessions that
# launched its subagents export CLAUDE_EFFORT=xhigh.
effort: xhigh
