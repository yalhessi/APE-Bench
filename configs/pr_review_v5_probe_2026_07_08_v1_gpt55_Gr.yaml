# Test (e): condition G on the post-cutoff set with gpt-5.5 at reasoning_effort high. The caps are
# raised past gpt-5.2's high-effort runs, where 10 of 32 sessions stopped at 80 turns or 7.2M tokens
# still searching; a capped session submits nothing. Token caps are the dollar caps at the calibrated
# 1.2M tokens a billed dollar (test_token_budget), so the dollar cap binds first on this pricier model.
extends: pr_review_v5_probe_2026_07_08_v1_gpt52_G.yaml

llm_config:
  model_name: gpt_5.5
  reasoning_effort: high
  # Chat Completions rejects tools with a reasoning effort on this model (HTTP 400, 2026-09-30), so
  # the Responses API, with carry-over off (the default): the Chat-equivalent condition (live check 1 in
  # docs/todo/llm-openai-responses-provider.md). The first run name, ..._Gr_rep1, is spent.
  openai_api: responses

execution:
  max_turns: 160

dataset:
  solo_cost_cap: 20.00
  solo_token_cap: 24000000
  # 6 PRs x $20.00 worst case a run; a ceiling, not a forecast.
  run_total_cost_cap: 120.50
  run_total_token_cap: 144600000
