# Phase 2 of docs/plans/2026-09-30-post-carryover-replan.md: the pipeline as built -- lead mode, the
# arms, the gate -- on validation small12, with gpt_5.2 at high effort through the Responses API and
# reasoning carried across turns in the lead and in every arm (nested_config copies the parent's
# llm_config). Every run in the record before 2026-09-30 ran the lead at reasoning off, so the base's
# caps were calibrated on sessions that never reasoned: arm jobs p50 $0.034 / 35K tokens, max $0.085 /
# 155K (probe_postcutoff_lead_rep1). The caps here are set from this config's own calibration
# (results/pr_review_v5/probes/phase2-lead-carried-2026-09-30/), in step at 1.2M tokens a dollar.
extends: pr_review_v5_val_2025_06_2026_03_v1_small12.yaml

llm_config:
  reasoning_effort: high
  openai_api: responses
  openai_responses_reasoning_carryover: true

execution:
  max_turns: 80

dataset:
  pr_numbers: [26185, 26755, 28649, 29842, 30458, 30641, 32080, 32875, 34091, 34935, 36822]
  standard_budget_cap: 2.00
  standard_budget_tokens: 2400000
  lead_cost_cap: 6.00
  lead_token_cap: 7200000
  per_pr_cost_cap: 20.00
  per_pr_token_cap: 24000000
  run_total_cost_cap: 300.00
  run_total_token_cap: 360000000
