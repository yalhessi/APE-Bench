# Idiom checker on a CURATED 10-PR experiment set (~1/6 the cost of the 57-PR full run).
# Use this to iterate on the checker + in-file verification + lean_verify_edit tool cheaply,
# then promote to the full set only once the small set looks right.
#
# The set is chosen to exercise every phenomenon we're testing:
#   - new-declaration verification (the B / harness-fix test): 33098 (explicit pre-fix refusal,
#     grind on new lemmas), 33287 (simp on new theorem, 2 files), 33137 (Fin.neZero_of_exists)
#   - missed idiom golfs we want to newly catch: 33401 (grw), 33145 (10 dualize golfs), 33285 (simp)
#   - cross-file / multi-file (A-relevant): 33287 (2), 33285 (9), 33356 (2)
#   - covered positive controls (checker SHOULD catch): 33373, 33356, 33078, 33111, 33401 (n=0)
#
#   python -m src.datasets.pr_review_v2.runner_workspace --config configs/pr_review_idiom_v2_small.yaml

scaffold_type: ape_agent

llm_config:
  model_name: gpt_5.2
  max_tokens: 16000
  thinking_budget_tokens: 8000
  temperature: 1.0

execution:
  max_turns: 40
  sample_max_cost: 2.0
  max_concurrency: 10

task_config:
  finding_budget: 10
  # enabled_tools omitted -> the idiom checker's native verify+search toolset (+ lean_verify_edit).

dataset:
  task_type: lean_pr_review_idiom
  run_name: pr_review_idiom_gpt52_small_decl
  output_file: inputs/pr_review_v2/predictions/preds_idiom_gpt_5.2_small_decl.jsonl
  records: inputs/pr_review_v2/mathlib_pr_review_v2_annotated_20260612.jsonl
  pr_numbers: [33401, 33098, 33287, 33137, 33145, 33285, 33373, 33356, 33078, 33111]
  resume: true
