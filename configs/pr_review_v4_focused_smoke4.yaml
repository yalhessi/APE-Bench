# Focused arm (4 specialists) on the 4-PR smoke, release dev-medium-0.3.0.
scaffold_type: ape_agent

llm_config:
  model_name: gpt_5.2
  max_tokens: 32000
  thinking_budget_tokens: 30000
  temperature: 1.0

execution:
  max_turns: 40
  max_concurrency: 8
  sample_max_cost: 2.0

task_config:
  enabled_tools:
    - file_read
    - content_search
    - lean_verify
    - get_lean_goal
    - code_hover
    - code_goto
    - code_references

dataset:
  arm: focused
  release: inputs/pr_review_v4/releases/dev-medium-0.3.0
  modification_inventory: inputs/pr_review_v4/treatments/systematic-opportunities-v2-medium/derived/modification_inventory.jsonl
  output_file: results/pr_review_v4/runs/dev-medium-v12-focused-smoke4-rep1/candidate_responses.jsonl
  run_name: pr_review_v4_focused_smoke4_rep1
  pr_numbers: [33057, 33066, 33098, 33438]
  dry_run: false
  require_prebuilt_workspaces: true
