# Model sessions over folders (`packet_session`, src/ape/tasks/packet_session.py), on the route the
# probes' hand-launched sessions used: claude-opus-5-5 at effort xhigh through Claude Code 2.1.285
# on the subscription login (conventions-ceiling-2026-10-04/run_claude_batch.sh). The session reads
# and writes in its folder and nowhere else: built-in file tools only, contained to the attempt's
# workspace, no shell, no web.
#
#   python -m src.mathlib_review.review.cli session --plan <session plan dir> \
#       --config configs/session/packet_session_opus55_claude_sub.yaml --run-name <name> --execute
#
# The plan fixes the replicates; early stop is always off. A run on the primary subscription token
# is the user's call (CLAUDE.md).
scaffold_type: claude_code

llm_config:
  model_name: null

claude_model: claude-opus-5-5
cli_version: 2.1.285
effort: xhigh

permission_mode: dontAsk
setting_sources: []
strict_mcp_config: true
tools: [Read, Write, Grep, Glob]
disallowed_tools: [Bash, BashOutput, KillShell, WebFetch, WebSearch, Task, Edit, MultiEdit,
                   NotebookEdit]
contain_to_workspace: true
batch_preamble: plain
workspace_environment: false

execution:
  max_turns: 80
  sample_max_tokens: 6000000

dataset: {}
