# Holistic acceptability reviewer (lean_pr_review_v2) on the curated 10-PR set, WITH the
# lean_verify_edit tool now available to it (it can test that a suggested change compiles before
# reporting it — the same edit-testing the focused checkers have). Fresh run for the 3-way
# holistic vs golf vs idiom comparison on identical PRs/model/tools.
#
#   python -m src.datasets.pr_review_v2.runner_workspace --config configs/pr_review_holistic_v2_small.yaml

scaffold_type: ape_agent

llm_config:
  model_name: gpt_5.2
  max_tokens: 16000
  thinking_budget_tokens: 8000
  temperature: 1.0

execution:
  max_turns: 40
  sample_max_cost: 2.0
  max_concurrency: 10

task_config:
  finding_budget: 10
  prompt_version: acceptability_v2
  enabled_tools: [file_read, content_search, lean_verify, get_lean_goal, code_hover, code_goto, code_references]

dataset:
  task_type: lean_pr_review_v2
  run_name: pr_review_holistic_gpt52_small_edittool
  output_file: inputs/pr_review_v2/predictions/preds_holistic_gpt_5.2_small_edittool.jsonl
  records: inputs/pr_review_v2/mathlib_pr_review_v2_annotated_20260612.jsonl
  pr_numbers: [33401, 33098, 33287, 33137, 33145, 33285, 33373, 33356, 33078, 33111]
  resume: true
