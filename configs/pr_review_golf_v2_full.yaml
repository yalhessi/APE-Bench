# Golf checker on the FULL gold-bearing set (57 PRs, 115 findings), with IN-FILE verification.
# Re-run of the golf checker now that VerifiedPRReviewTask verifies edits by recompiling the
# patched file (so a shorter proof may reference the PR's own new declarations) — measures golf's
# TRUE recall vs the prior snippet-verification runs whose recall was capped by the harness gap.
# enabled_tools omitted so the checker uses its own verify+search-heavy native toolset.
#
#   python -m src.datasets.pr_review_v2.runner_workspace --config configs/pr_review_golf_v2_full.yaml

scaffold_type: ape_agent

llm_config:
  model_name: gpt_5.2
  max_tokens: 16000
  thinking_budget_tokens: 8000
  temperature: 1.0

execution:
  max_turns: 40
  sample_max_cost: 2.0
  max_concurrency: 16

task_config:
  finding_budget: 10
  # enabled_tools intentionally omitted -> the golf checker's native verify+search toolset.

dataset:
  task_type: lean_pr_review_golf
  # Fresh run_name + output_file so the orchestrator does NOT resume an earlier run dir.
  # `edittool`: in-file verification PLUS the lean_verify_edit tool (test edits before submitting).
  run_name: pr_review_golf_gpt52_57prs_decl
  output_file: inputs/pr_review_v2/predictions/preds_golf_gpt_5.2_decl.jsonl
  records: inputs/pr_review_v2/mathlib_pr_review_v2_annotated_20260612.jsonl
  pr_numbers: [33048, 33065, 33066, 33067, 33070, 33078, 33079, 33081, 33086, 33090,
               33092, 33098, 33101, 33104, 33111, 33117, 33127, 33137, 33141, 33145,
               33146, 33149, 33150, 33153, 33154, 33169, 33183, 33190, 33201, 33203,
               33207, 33208, 33232, 33267, 33268, 33283, 33285, 33287, 33294, 33310,
               33316, 33321, 33332, 33333, 33337, 33343, 33345, 33349, 33356, 33362,
               33373, 33376, 33395, 33400, 33401, 33419, 33421]
  resume: true