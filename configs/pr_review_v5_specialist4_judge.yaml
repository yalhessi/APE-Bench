# Score the specialist-only run.
#
# READ ONE THING WITH CARE. PR 33117's gold anchors are the thirteen *base* lemmas — the sites
# that would gain `@[to_fun]`. Both published 33117 findings anchor on `fun_deriv` and
# `fun_neg`, the lemmas that would be *deleted*: the same defect, the opposite end of the same
# edit. Anchor-tier pairing cannot join them, so they score as misses. That is a real limit of
# the reviewer (it named the redundancy, not the mechanism) and also a real limit of the
# measurement (the gold anchor set is mixed — `fun_iterated_deriv` is in it, the other twelve
# `fun_*` are not). Do not read a 33117 miss as "nothing was found".
# NO PATHS HERE. `candidates`, `out_dir` and `run_name` are derived by `judge --of <run_name>`
# from the generation run being scored. They used to be written out, and they disagreed:
# pr_review_v5_medium_heldout.yaml was bumped to rep2 while this file still read rep1 --
# scoring the old run under the new run's name, with nothing to notice. One source now.
#
#   python -m src.datasets.pr_review_v5.cli judge --config <this> --of <run_name> --execute
extends: bases/v5_judge.yaml

dataset:
  pr_numbers: [33117, 33145, 33337, 33362]
  # No control PRs in this set — both controls are larger than every PR here — so precision
  # and silent-PR emission are unmeasurable.
  control_pr_numbers: []
