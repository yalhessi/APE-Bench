# SMOKE for Claude Code on the subscription: condition C (G under Claude Code, contained) with
# Claude Opus 5.5 on the CLI's own login in place of gpt_5.2 through the relay.
#
# Not a cell of docs/plans/2026-10-01-claude-models-under-the-harness.md: those run contract v2,
# whose keys live on post-carryover-replan. This checks the route end to end on one small PR
# before they are built -- the login, the pinned model and CLI in claude_code_session.json, a
# clean and usable containment audit, and the session's processed tokens and replies against
# the solo_token_cap (1.8M, calibrated on gpt) and max_turns (40) it inherits. The probe
# harness ran Claude uncapped, so a cell whose caps bind is not comparable with it.
#
# Needs CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) in the launching shell, and no
# ANTHROPIC_* variable there.
extends: pr_review_v5_probe_2026_07_08_v1_gpt52_G_claude.yaml

# Null starts no relay; the CLI then runs claude_model on its own login.
llm_config:
  model_name: null

claude_model: claude-opus-5-5
cli_version: 2.1.285
# The probe harness never recorded its Claude effort; the Claude Code sessions that launched
# its subagents export CLAUDE_EFFORT=xhigh.
effort: xhigh
