# NOTE: this scores rep1, which is the run that exists on disk. The generation config beside
# it was bumped to `pr_review_v5_lead_medium_heldout_rep2`, which has never been run -- so if
# you run that first, this config will still score rep1 and report it under a rep1 name while
# you believe you are looking at rep2.
#
# Prefer deriving the paths rather than restating them:
#     python -m src.datasets.pr_review_v4.judge_runner \
#         --config configs/pr_review_v5_medium_heldout_judge.yaml \
#         --of pr_review_v5_lead_medium_heldout_rep2
# `--of` sets candidates/out_dir/run_name from the one name and refuses a config whose
# candidates point at a different run.

# Score a v5 run against gold: issue_match and resolution_match, rubric v8.
#
# `input_kind: finding` judges the text the system actually publishes, not pre-merge
# candidate wording — a verdict on wording the merge discarded credits nothing real.
#
# Aggregation is `majority_issue_then_resolution_among_issue_matching`: resolution is only
# scored among pairs whose issue already matched, which is exactly the two-level question
# ("did it raise the same issue" / "and did it propose the same fix").
# NO PATHS HERE. `candidates`, `out_dir` and `run_name` are derived by `judge --of <run_name>`
# from the generation run being scored. They used to be written out, and they disagreed:
# pr_review_v5_medium_heldout.yaml was bumped to rep2 while this file still read rep1 --
# scoring the old run under the new run's name, with nothing to notice. One source now.
#
#   python -m src.datasets.pr_review_v5.cli judge --config <this> --of <run_name> --execute
extends: bases/v5_judge.yaml

dataset:
  pr_numbers:
  - 33117
  - 33145
  - 33149
  - 33285
  - 33294
  - 33305
  - 33321
  - 33337
  - 33362
  - 33421
  control_pr_numbers:
  - 33304
  - 33315
