# The contract ceiling -- docs/plans/2026-09-23-work-enumeration.md, "Decision, 2026-09-23".
#
# Its control with the submission contract changed, and nothing else. Phase 0
# (docs/research/the-question-is-already-asked-2026-09.md) found the current briefs already ask 17
# of 23 held-out questions, and that where they do the misses are the arm holding the question
# pruned (25 of 42) or run and silent (15). The control removes the first by having no lead; this
# condition tests whether the contract moves the second.
#
# All of it lives in the submission tool; the rendered prompts are untouched:
#   target_verdicts                  -- every target gets `issue`, `no_issue` or
#                                       `cannot_determine`, with its reason. Not forcing.
#   submission_verification_policy   -- an edit supplied is compiled; an ask without one is
#                                       filed as `diagnostic` instead of refused (7eef7af).
extends: pr_review_v5_verdicts_fanout4_control.yaml
dataset:
  target_verdicts: true
  submission_verification_policy: verify_edits_if_present
