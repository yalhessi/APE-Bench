# Calibration run: the delegating reviewer on the 4-PR smoke set.
#
# 33057 / 33066 / 33098 carry gold (1 + 3 + 14 = 18 obligations); 33438 is the CONTROL —
# maintainers asked for nothing there, so anything the agent emits on it is a false positive.
# This is the same set as results/pr_review_v4/runs/dev-medium-smoke4-rep1.
#
# Sized for a look, not for an effect size: at 18 obligations one flipped verdict is 5.6pp.
# The run name is an invocation argument, not a config key: this file
# describes a PR set and a policy. Last run under `pr_review_v5_lead_smoke4_rep7`.
#   ... --run-name <name>
extends: bases/v5_generation.yaml

dataset:
  pr_numbers:
  - 33057
  - 33066
  - 33098
  - 33438
  per_pr_cost_cap: 2.0
  # 9 specialist arms x 22 work units = 180 eligible jobs. The base's 25 would let the lead
  # touch a seventh of them, which makes the run a test of its triage rather than of whether
  # the arms can find the gold at all. Discovery first.
  max_delegations: 60
