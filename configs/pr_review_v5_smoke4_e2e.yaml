# End-to-end validation on the four smallest heldout PRs. NOT a measurement.
#
# WHAT THIS IS FOR. Everything built since rep2 is offline-verified and none of it has run
# against a model: context slices, the comprehension gate, the coverage contract, the
# `family_design` arm, and coordinated patches. This run asks whether the machinery works
# end to end — not whether it finds more.
#
# WHY THESE FOUR. They are the smallest by work unit (13 units against heldout11's 71) and
# between them they exercise every new mechanism:
#
#   33117  5 units, 1 obligation  — thirteen hand-written `fun_*` lemmas; family + coordinated
#   33145  4 units, 5 obligations — a dualised API; 3 of its 5 obligations are coordinated
#   33337  2 units, 2 obligations — rename a pair across two work units; family + convention
#   33362  2 units, 1 obligation  — namespace placement; the file-skeleton case
#
# NO CONTROL PR. 33304 and 33315 are the controls and both are larger than every PR here, so
# this run cannot measure precision — only that the pipeline runs and the mechanisms engage.
# Add 33315 if you want the false-positive signal back; it costs 11 more work units.
#
# READ IT AS A CHECKLIST, NOT A SCORE. In order:
#   1. every lead called `submit_comprehension` before delegating (comprehension.jsonl is
#      non-empty and has one row per PR);
#   2. `family_design` actually ran, and did not have every candidate rejected;
#   3. if any candidate carried a `patch_set`, it compiled — and if none did, that is a
#      finding about the arm, not about the mechanism;
#   4. verification is alive (ok > 0, failed-empty = 0);
#   5. `generalist_evidence_gate` reads `evidence_chain`;
#   6. no candidate rejections from the slice text (a slice should not push an arm outside
#      its contract).
#
# 9 obligations across 4 PRs, so one flipped verdict is 11pp. Any recall number from this is
# noise; the point is that the chain runs.
scaffold_type: ape_agent

llm_config:
  model_name: gpt_5.2
  max_tokens: 32000
  thinking_budget_tokens: 30000
  temperature: 1.0

execution:
  max_turns: 40
  max_concurrency: 4

task_config:
  enabled_tools:
    - file_read
    - content_search
    - lean_verify
    - get_lean_goal
    - code_hover
    - code_goto

dataset:
  routing_mode: lead
  release: inputs/pr_review_v4/releases/dev-medium-0.3.0
  modification_inventory: inputs/pr_review_v4/treatments/systematic-opportunities-v2-medium/derived/modification_inventory.jsonl
  run_name: pr_review_v5_smoke4_e2e_rep1
  pr_numbers: [33117, 33145, 33337, 33362]
  require_prebuilt_workspaces: true

  # Reads the base commit's `.ilean` index so importance can raise a proposal to `required`.
  # ~4.4s per distinct base commit — four here, so about twenty seconds.
  use_exposure_index: true

  # The deterministic arm is deliberately OMITTED (no execution_release): every finding
  # scored should be one the agent produced.

  standard_budget_cap: 0.30
  lead_cost_cap: 1.00
  per_pr_cost_cap: 1.50
  max_delegations: 25
