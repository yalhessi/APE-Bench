# Test (e)'s high-effort half as amended 2026-09-30 (results/pr_review_v5/probes/gpt52-postcutoff-2026-09-29/
# README.md): gpt_5.2 at high effort through the Responses API with reasoning carried across turns, on
# the six post-cutoff PRs. Only persistence differs from Gr1 (pr_review_v5_probe_2026_07_08_v1_gpt52_Gr.yaml):
# same brief, tools and 80 turns. The token cap is the carry-over coherence test's, since carried
# reasoning adds processed tokens that Gr1's 7.2M would stop on, and the dollar cap is in step with it.
extends: pr_review_v5_probe_2026_07_08_v1_gpt52_Gr.yaml

llm_config:
  openai_api: responses
  openai_responses_reasoning_carryover: true

dataset:
  solo_cost_cap: 13.40
  solo_token_cap: 16080000
  # 6 PRs x $13.40 worst case a run; a ceiling, not a forecast.
  run_total_cost_cap: 80.50
  run_total_token_cap: 96600000
